<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المسؤول | NovaStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        :focus-visible {
            outline: 3px solid #4f46e5;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-300">
    <!-- رابط الانتقال السريع للمحتوى الأساسي -->
    <a href="#publish-form" id="skip-link" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:right-4 focus:bg-indigo-600 focus:text-white focus:px-4 focus:py-2 focus:rounded-xl focus:z-[100] focus:ring-2 focus:ring-offset-2 focus:ring-indigo-600">تخطي إلى المحتوى الأساسي</a>

    <!-- الترويسة: بدون شعار، فقط زر العودة وزر تسجيل الخروج -->
    <header class="bg-white dark:bg-gray-800 shadow-sm p-4 sticky top-0 z-50">
        <div class="container mx-auto flex items-center justify-between">
            <a href="index.html" id="back-link" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 transition-colors flex items-center gap-2 font-bold" aria-label="العودة للمتجر">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
                <span id="back-text">العودة للمتجر</span>
            </a>
            <button id="logout-btn" class="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400 rounded-xl font-bold hover:bg-red-100 dark:hover:bg-red-900/50 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                </svg>
                <span id="logout-text">تسجيل الخروج</span>
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10 max-w-2xl flex-grow w-full">
        <!-- رسالة الترحيب -->
        <div class="mb-8">
            <h1 id="welcome-title" tabindex="-1" class="text-2xl md:text-3xl font-bold text-gray-800 dark:text-white focus:outline-none">مرحباً بك في لوحة التحكم</h1>
            <p id="welcome-sub" class="text-gray-500 dark:text-gray-400 mt-2">من هنا يمكنك نشر المنتجات الجديدة في المتجر.</p>
        </div>

        <!-- نموذج نشر المنتج -->
        <section id="publish-form" class="bg-white dark:bg-gray-800 rounded-2xl p-6 md:p-8 shadow-sm border border-gray-100 dark:border-gray-700">
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-indigo-600" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z" />
                </svg>
                <span id="form-title-text">نشر منتج جديد</span>
            </h2>

            <form id="product-form" class="space-y-6" novalidate>
                <!-- رابط المنتج -->
                <div>
                    <label for="product-link" id="label-link" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">رابط المنتج</label>
                    <input type="url" id="product-link" name="link"
                           class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-700 border-none focus:ring-2 focus:ring-indigo-600 transition-all dark:text-white"
                           placeholder="https://www.amazon.com/..."
                           aria-describedby="link-error">
                    <span id="link-error" class="text-xs text-red-500 mt-1.5 block hidden" role="alert"></span>
                </div>

                <!-- صورة المنتج -->
                <div>
                    <label for="product-image" id="label-image" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">رابط صورة المنتج</label>
                    <input type="url" id="product-image" name="image"
                           class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-700 border-none focus:ring-2 focus:ring-indigo-600 transition-all dark:text-white"
                           placeholder="https://.../product.jpg"
                           aria-describedby="image-error">
                    <span id="image-error" class="text-xs text-red-500 mt-1.5 block hidden" role="alert"></span>
                </div>

                <!-- وصف المنتج -->
                <div>
                    <label for="product-description" id="label-description" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">وصف المنتج</label>
                    <textarea id="product-description" name="description" rows="4"
                              class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-700 border-none focus:ring-2 focus:ring-indigo-600 transition-all dark:text-white resize-y"
                              placeholder="اكتب وصفاً موجزاً وجذاباً للمنتج..."
                              aria-describedby="description-error"></textarea>
                    <span id="description-error" class="text-xs text-red-500 mt-1.5 block hidden" role="alert"></span>
                </div>

                <!-- رسالة الحالة -->
                <div id="form-status" class="text-center text-green-600 dark:text-green-400 font-bold p-4 bg-green-50 dark:bg-green-900/30 rounded-xl hidden" role="status" aria-live="polite"></div>

                <!-- الأزرار -->
                <div class="flex flex-col sm:flex-row gap-3">
                    <button type="submit" id="btn-publish" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition-all shadow-lg flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                        </svg>
                        <span id="btn-publish-text">نشر المنتج</span>
                    </button>
                    <button type="button" id="btn-reset" class="flex-1 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 py-3 rounded-xl font-bold hover:bg-gray-200 dark:hover:bg-gray-600 transition-all flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                        </svg>
                        <span id="btn-reset-text">إعادة تعيين</span>
                    </button>
                </div>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer id="footer-copyright" class="p-8 text-center text-gray-400 text-sm">
        &copy; 2026 NovaStore. جميع الحقوق محفوظة.
    </footer>

    <script>
        // قاموس الترجمات لهذه الصفحة
        const translations = {
            ar: {
                title: "لوحة تحكم المسؤول | NovaStore",
                skip_to_content: "تخطي إلى المحتوى الأساسي",
                back: "العودة للمتجر",
                logout: "تسجيل الخروج",
                welcome_title: "مرحباً بك في لوحة التحكم",
                welcome_sub: "من هنا يمكنك نشر المنتجات الجديدة في المتجر.",
                form_title: "نشر منتج جديد",
                label_link: "رابط المنتج",
                link_placeholder: "https://www.amazon.com/...",
                label_image: "رابط صورة المنتج",
                image_placeholder: "https://.../product.jpg",
                label_description: "وصف المنتج",
                description_placeholder: "اكتب وصفاً موجزاً وجذاباً للمنتج...",
                btn_publish: "نشر المنتج",
                btn_reset: "إعادة تعيين",
                success_msg: "تم تجهيز بيانات المنتج بنجاح. سيتم إرسالها إلى الخادم في مرحلة لاحقة.",
                err_link_required: "يرجى إدخال رابط المنتج.",
                err_link_invalid: "يرجى إدخال رابط صالح يبدأ بـ http:// أو https://.",
                err_image_required: "يرجى إدخال رابط صورة المنتج.",
                err_image_invalid: "يرجى إدخال رابط صورة صالح.",
                err_description_required: "يرجى إدخال وصف المنتج.",
                footer_copyright: "&copy; 2026 NovaStore. جميع الحقوق محفوظة."
            },
            fr: {
                title: "Tableau de bord Admin | NovaStore",
                skip_to_content: "Passer au contenu principal",
                back: "Retour au magasin",
                logout: "Déconnexion",
                welcome_title: "Bienvenue au tableau de bord",
                welcome_sub: "Vous pouvez publier de nouveaux produits dans le magasin.",
                form_title: "Publier un nouveau produit",
                label_link: "Lien du produit",
                link_placeholder: "https://www.amazon.com/...",
                label_image: "Lien de l'image du produit",
                image_placeholder: "https://.../product.jpg",
                label_description: "Description du produit",
                description_placeholder: "Écrivez une description courte et attrayante...",
                btn_publish: "Publier le produit",
                btn_reset: "Réinitialiser",
                success_msg: "Les données du produit ont été préparées avec succès. Elles seront envoyées au serveur dans une étape ultérieure.",
                err_link_required: "Veuillez entrer le lien du produit.",
                err_link_invalid: "Veuillez entrer un lien valide commençant par http:// ou https://.",
                err_image_required: "Veuillez entrer le lien de l'image du produit.",
                err_image_invalid: "Veuillez entrer un lien d'image valide.",
                err_description_required: "Veuillez entrer la description du produit.",
                footer_copyright: "&copy; 2026 NovaStore. Tous droits réservés."
            },
            en: {
                title: "Admin Dashboard | NovaStore",
                skip_to_content: "Skip to main content",
                back: "Back to store",
                logout: "Logout",
                welcome_title: "Welcome to the Admin Dashboard",
                welcome_sub: "You can publish new products to the store from here.",
                form_title: "Publish a New Product",
                label_link: "Product Link",
                link_placeholder: "https://www.amazon.com/...",
                label_image: "Product Image Link",
                image_placeholder: "https://.../product.jpg",
                label_description: "Product Description",
                description_placeholder: "Write a short and catchy product description...",
                btn_publish: "Publish Product",
                btn_reset: "Reset",
                success_msg: "Product data prepared successfully. It will be sent to the server in a later phase.",
                err_link_required: "Please enter the product link.",
                err_link_invalid: "Please enter a valid link starting with http:// or https://.",
                err_image_required: "Please enter the product image link.",
                err_image_invalid: "Please enter a valid image link.",
                err_description_required: "Please enter the product description.",
                footer_copyright: "&copy; 2026 NovaStore. All rights reserved."
            }
        };

        // تطبيق الوضع الليلي من إعدادات المستخدم
        function applyTheme() {
            const theme = localStorage.getItem('selectedTheme') || 'light';
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // تطبيق اللغة على عناصر الصفحة
        function applyLang() {
            const lang = localStorage.getItem('selectedLang') || 'ar';
            const t = translations[lang];

            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            document.title = t.title;

            document.getElementById('skip-link').textContent = t.skip_to_content;
            document.getElementById('back-text').textContent = t.back;
            document.getElementById('back-link').setAttribute('aria-label', t.back);
            document.getElementById('logout-text').textContent = t.logout;
            document.getElementById('welcome-title').textContent = t.welcome_title;
            document.getElementById('welcome-sub').textContent = t.welcome_sub;
            document.getElementById('form-title-text').textContent = t.form_title;

            document.getElementById('label-link').textContent = t.label_link;
            document.getElementById('product-link').placeholder = t.link_placeholder;
            document.getElementById('label-image').textContent = t.label_image;
            document.getElementById('product-image').placeholder = t.image_placeholder;
            document.getElementById('label-description').textContent = t.label_description;
            document.getElementById('product-description').placeholder = t.description_placeholder;

            document.getElementById('btn-publish-text').textContent = t.btn_publish;
            document.getElementById('btn-reset-text').textContent = t.btn_reset;
            document.getElementById('footer-copyright').innerHTML = t.footer_copyright;
        }

        // حماية الصفحة: التأكد من وجود جلسة دخول صالحة
        function checkSession() {
            if (sessionStorage.getItem('nova_admin_session') !== 'true') {
                window.location.href = 'admin-login.html';
                return false;
            }
            return true;
        }

        // تسجيل الخروج: حذف الجلسة والعودة لصفحة الدخول
        function logout() {
            sessionStorage.removeItem('nova_admin_session');
            window.location.href = 'admin-login.html';
        }

        // التحقق من صحة الحقول وإرجاع حالة الصلاحية
        function validateForm(lang) {
            const t = translations[lang];
            const linkInput = document.getElementById('product-link');
            const imageInput = document.getElementById('product-image');
            const descInput = document.getElementById('product-description');
            const linkError = document.getElementById('link-error');
            const imageError = document.getElementById('image-error');
            const descError = document.getElementById('description-error');

            let isValid = true;
            const urlPattern = /^https?:\/\/.+/i;

            // التحقق من رابط المنتج
            if (!linkInput.value.trim()) {
                linkError.textContent = t.err_link_required;
                linkError.classList.remove('hidden');
                linkInput.setAttribute('aria-invalid', 'true');
                isValid = false;
            } else if (!urlPattern.test(linkInput.value.trim())) {
                linkError.textContent = t.err_link_invalid;
                linkError.classList.remove('hidden');
                linkInput.setAttribute('aria-invalid', 'true');
                isValid = false;
            } else {
                linkError.textContent = "";
                linkError.classList.add('hidden');
                linkInput.removeAttribute('aria-invalid');
            }

            // التحقق من رابط الصورة
            if (!imageInput.value.trim()) {
                imageError.textContent = t.err_image_required;
                imageError.classList.remove('hidden');
                imageInput.setAttribute('aria-invalid', 'true');
                isValid = false;
            } else if (!urlPattern.test(imageInput.value.trim())) {
                imageError.textContent = t.err_image_invalid;
                imageError.classList.remove('hidden');
                imageInput.setAttribute('aria-invalid', 'true');
                isValid = false;
            } else {
                imageError.textContent = "";
                imageError.classList.add('hidden');
                imageInput.removeAttribute('aria-invalid');
            }

            // التحقق من الوصف
            if (!descInput.value.trim()) {
                descError.textContent = t.err_description_required;
                descError.classList.remove('hidden');
                descInput.setAttribute('aria-invalid', 'true');
                isValid = false;
            } else {
                descError.textContent = "";
                descError.classList.add('hidden');
                descInput.removeAttribute('aria-invalid');
            }

            return isValid;
        }

        // دالة نشر المنتج (API-Ready): تجمع البيانات فقط دون أي تخزين محلي
        // في مرحلة لاحقة يتم استبدالها بإرسال fetch إلى الخادم
        function publishProduct(data) {
            return new Promise(function (resolve) {
                setTimeout(function () {
                    resolve(data);
                }, 300);
            });
        }

        // إظهار أو إخفاء رسالة الحالة
        function showStatus(message, isError) {
            const status = document.getElementById('form-status');
            if (!message) {
                status.classList.add('hidden');
                return;
            }
            status.textContent = message;
            status.classList.remove('hidden');
            status.className = 'text-center font-bold p-4 rounded-xl ' + (isError
                ? 'text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/30'
                : 'text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-900/30');
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (!checkSession()) return;
            applyTheme();
            applyLang();

            // نقل التركيز لعنوان الترحيب لمساعدة مستخدمي قارئات الشاشة
            const welcome = document.getElementById('welcome-title');
            if (welcome) welcome.focus();

            // زر تسجيل الخروج
            document.getElementById('logout-btn').addEventListener('click', logout);

            // نموذج نشر المنتج
            document.getElementById('product-form').addEventListener('submit', function (e) {
                e.preventDefault();
                const lang = localStorage.getItem('selectedLang') || 'ar';
                const t = translations[lang];

                showStatus("", false);

                if (!validateForm(lang)) {
                    // تركيز لوحة المفاتيح على أول حقل غير صالح
                    const firstInvalid = document.querySelector('#product-form [aria-invalid="true"]');
                    if (firstInvalid) firstInvalid.focus();
                    return;
                }

                // تجميع بيانات المنتج في كائن منظم
                const productData = {
                    link: document.getElementById('product-link').value.trim(),
                    image: document.getElementById('product-image').value.trim(),
                    description: document.getElementById('product-description').value.trim(),
                    publishedAt: new Date().toISOString()
                };

                // استدعاء دالة النشر الجاهزة للربط بالخادم لاحقاً
                publishProduct(productData).then(function () {
                    showStatus(t.success_msg, false);
                });
            });

            // زر إعادة تعيين النموذج
            document.getElementById('btn-reset').addEventListener('click', function () {
                document.getElementById('product-form').reset();
                document.getElementById('link-error').classList.add('hidden');
                document.getElementById('image-error').classList.add('hidden');
                document.getElementById('description-error').classList.add('hidden');
                document.querySelectorAll('#product-form [aria-invalid]').forEach(function (el) {
                    el.removeAttribute('aria-invalid');
                });
                showStatus("", false);
                document.getElementById('product-link').focus();
            });
        });
    </script>
</body>
</html>
